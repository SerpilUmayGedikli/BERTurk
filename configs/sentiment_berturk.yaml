# Task B: Turkish sentiment analysis (Positive / Negative / Notr).
task: sentiment

data:
  dataset_id: winvoker/turkish-sentiment-analysis-dataset
  dataset_config: null
  text_column: text
  label_column: label
  # Origin of each row (wiki, urun_yorumlari, ...). Kept for analysis only, never a feature.
  source_column: dataset
  # The dataset has its own test split, so test_size is not used.
  test_size: 0.15
  # Validation fraction of the train split (stratified).
  val_size: 0.10
  seed: 42
  cache_dir: data/hf_cache
  processed_dir: data/processed/sentiment

model:
  name: dbmdz/bert-base-turkish-cased
  # Uncased alternative (verified on the Hub 2026-11-06, MIT): dbmdz/bert-base-turkish-uncased
  max_length: 128

summary:
  # ~440k rows: token-length stats are estimated on a fixed-seed sample per split.
  token_stats_sample: 20000

baseline:
  # TF-IDF settings are fixed; only C is tuned, on validation macro-F1.
  tfidf:
    ngram_range: [1, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
    max_features: null
  models:
    logreg:
      C: [0.1, 1.0, 10.0, 100.0]
      max_iter: 2000
    linear_svc:
      C: [0.01, 0.1, 1.0, 10.0]
      max_iter: 5000
  # Extra LinearSVC fits (best C, these random_states) to measure its
  # validation-only sensitivity to the solver's random shuffling.
  svc_seed_check: [0, 1, 2]
  top_features: 25
  output: reports/baseline_sentiment.json

training:
  tag: len128_n50k
  learning_rate: 2.0e-5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: auto
  early_stopping_patience: 1
  class_weighted_loss: false
  # 394,642 train rows is too much for 3 seeds on a free T4; train on a stratified,
  # seeded 50k subset. Validation and test stay complete.
  max_train_samples: 50000
  truncation: head      # p95 is ~90 tokens, so 128 covers ~98% of texts
  head_tokens: 64
  output_dir: checkpoints
  save_total_limit: 2
  logging_steps: 100
  report_dir: reports
  focus_label: Notr
  smoke:
    train_samples: 200
    eval_samples: 100
    max_length: 64
    epochs: 1
    batch_size: 16
